name: platform_services
description: "What the application has to ask the host operating system for."
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  diagnostics:
    path: ../diagnostics
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # Both are path_provider transitives; declared because the facade test
  # imports them directly to substitute a fake temp directory, which is what
  # makes the location-bearing-temp-file purge testable at all.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter
