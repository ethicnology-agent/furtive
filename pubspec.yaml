# Workspace root. It holds no application code: its job is to resolve every
# member against one dependency solution and one lockfile, so the app, the
# shared share layer and the web viewer can never drift onto different
# versions of `nostr`, `pointycastle` or the SDK itself. Before this, three
# independent lockfiles made that drift possible and invisible.
#
# It is still a package, not just a manifest: `tool/validate_share_config.dart`
# runs from the root and imports `package:furtive_share`, so the root needs a
# resolvable dependency on it.
name: furtive_workspace
description: "Workspace root for the Furtive application, its share layer and its web viewer."
publish_to: 'none'

environment:
  sdk: ^3.10.0

workspace:
  - apps/app
  - packages/furtive_share
  - viewer

dev_dependencies:
  furtive_share:
    path: packages/furtive_share
