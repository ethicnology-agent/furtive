# Workspace root. It holds no application code: its job is to resolve every
# member against one dependency solution and one lockfile, so the app, the
# shared share layer and the web viewer can never drift onto different
# versions of `nostr`, `pointycastle` or the SDK itself. Before this, three
# independent lockfiles made that drift possible and invisible.
#
# It is still a package, not just a manifest: `tool/validate_share_config.dart`
# runs from the root and imports `package:furtive_share`, so the root needs a
# resolvable dependency on it.
name: furtive_workspace
description: "Workspace root for the Furtive application, its share layer and its web viewer."
publish_to: 'none'

environment:
  sdk: ^3.10.0

workspace:
  - apps/app
  - apps/viewer
  - packages/activities
  - packages/activity_profile
  - packages/basemap
  - packages/wall_clock
  - packages/diagnostics
  - packages/furtive_share
  - packages/geo
  - packages/location
  - packages/map_view
  - packages/platform_services
  - packages/preferences
  - packages/recording_session
  - packages/ui_kit

dev_dependencies:
  furtive_share:
    path: packages/furtive_share

  # Task orchestration across the workspace members.
  melos: ^8.9.0

  # tool/check_architecture.dart parses every member's imports.
  analyzer: ^13.0.0
  path: ^1.9.1
  yaml: ^3.1.4

  # tool/format_dart_coverage.dart converts pure-Dart hitmaps to lcov.
  coverage: ^1.15.1

# Every task below runs the SDK from the PATH, so it is identical in CI,
# which installs Flutter directly, and locally, where `fvm exec` puts the
# version pinned in .fvmrc on the PATH:
#
#     fvm exec dart run melos run verify
# Removed the day josxha/flutter-maplibre#584 reaches a release.
#
# OfflineManager.downloadRegion leaks a JNI global reference per status
# event: its callbacks are async but release into the Arena of the `using`
# block that returned the stream, which closed before any of them ran. The
# global reference table fills at 51,200 entries and ART aborts the process.
# Measured on an Android 12 device against a control, same harness and day:
# 11,753 status events and a tombstone with the published package, 43,990
# events and no abort with this fix.
#
# That ceiling is about 84,000 tiles in one process. Keeping a 10 km radius
# never approaches it; keeping a country is 2.2 million tiles for France and
# cannot avoid it, so the feature does not work at all on the published
# package — 35 of 174 countries fit under it.
#
# A pinned git dependency rather than a copy in the tree: the package is
# 4.4 MB, 4.3 MB of which is one generated bindings file of 132,126 lines.
# The pin is a commit, held by the furtive-pin-1.4 tag on the fork so that
# iterating on the pull request cannot strand it.
#
# This is cut from upstream main rather than from 0.3.5, so it also carries
# the two Android leak fixes 0.3.6 brought and the removal of the ktlint
# plugin that made 0.3.6 unbuildable for consumers — which is why
# packages/map_view pins 0.3.5 in the first place.
dependency_overrides:
  maplibre_android:
    git:
      url: https://github.com/ethicnology-agent/flutter-maplibre.git
      path: packages/maplibre_android
      ref: 9a0a5724ab63826d5b9a4360c4aef523a489e809

melos:
  ide:
    intellij: false
  categories:
    apps:
      - apps/**
    packages:
      - packages/**
  command:
    run:
      noSelect: true
    bootstrap:
      enforceLockfile: true
  scripts:
    prepare:
      description: Install locked dependencies and generate every member's sources.
      run: dart run melos bootstrap && dart run melos run generate --no-select

    generate:
      description: Generate translations and private database code.
      dependsOn:
        - generate:l10n
        - generate:database

    generate:l10n:
      description: Generate localized messages from each member's ARB files.
      exec:
        command: flutter gen-l10n
        concurrency: 1
        failFast: true
      packageFilters:
        fileExists: l10n.yaml

    generate:database:
      description: Generate drift and dart_mappable sources in dependency order.
      exec:
        command: dart run build_runner build --delete-conflicting-outputs --force-jit
        concurrency: 1
        failFast: true
        orderDependents: true
      packageFilters:
        dependsOn: build_runner

    l10n:parity:
      description: Reject a locale whose ARB keys have drifted from English.
      run: python3 tool/check_arb_parity.py

    analyze:
      description: Analyze every member.
      dependsOn:
        - analyze:flutter
        - analyze:dart

    analyze:flutter:
      exec:
        command: flutter analyze --no-pub --fatal-infos
        concurrency: 1
        failFast: true
      packageFilters:
        flutter: true

    analyze:dart:
      exec:
        command: dart analyze --fatal-infos
        concurrency: 1
        failFast: true
      packageFilters:
        flutter: false

    format:check:
      description: Check formatting across every workspace member.
      run: dart run tool/check_format.dart

    architecture:
      description: Check module contracts, allowed dependencies, cycles and imports.
      run: dart run tool/check_architecture.dart

    graph:
      description: Regenerate the dependency diagram.
      run: dart run tool/graph.dart

    graph:check:
      description: Reject a stale dependency diagram.
      run: dart run tool/graph.dart --check

    test:
      description: Run every member's tests.
      dependsOn:
        - test:flutter
        - test:dart

    test:flutter:
      exec:
        command: dart run "$MELOS_ROOT_PATH/tool/test_module.dart" flutter --coverage
        concurrency: 1
        failFast: true
      packageFilters:
        flutter: true
        dirExists: test

    test:dart:
      # `dart test` emits a VM hitmap, not lcov, so the figure a pure-Dart
      # member contributes would otherwise be invisible to the coverage
      # floor — and a well-tested module leaving the application would lower
      # the measured total. format_coverage resolves from the workspace root,
      # which every member shares.
      exec:
        command: >-
          dart run "$MELOS_ROOT_PATH/tool/test_module.dart" dart --coverage=coverage &&
          dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info
          --base-directory=. --report-on=lib
        concurrency: 1
        failFast: true
      packageFilters:
        flutter: false
        dirExists: test

    coverage:
      description: Fail if line coverage drops below the ratcheted floor.
      run: python3 tool/coverage_threshold.py --report

    share:boundary:
      description: Reject an import that would drag Flutter, storage or sensors into the shared package.
      run: python3 tool/check_share_boundary.py

    share:config:
      description: Validate the live-share release configuration from the environment.
      run: dart run tool/validate_share_config.dart

    viewer:build:
      description: Compile and package the static web viewer.
      run: dart run tool/build_viewer.dart

    viewer:build:deployed:
      description: Package the viewer against the basemap the deployment ships.
      run: >-
        VIEWER_TILE_URL='https://tile.openstreetmap.org/{z}/{x}/{y}.png'
        dart run tool/build_viewer.dart build/viewer-basemap &&
        grep -q "img-src 'self' data: https://tile.openstreetmap.org"
        build/viewer-basemap/index.html

    app:
      description: Run the application on an available device.
      run: dart run tool/run_app.dart apps/app
      stdio: inherit

    ios:pods:
      description: Fetch the iOS pods for the application.
      run: flutter precache --ios && cd apps/app/ios && pod install --repo-update
      stdio: inherit

    apk:
      description: >-
        Build the release artefact inside the pinned container. Honours
        CONTAINER, MODE, FORMAT, GRADLE_HEAP, SOURCE_DATE_EPOCH and the
        PROTOMAPS/SHARE dart-defines.
      run: dart run tool/build_release.dart
      stdio: inherit

    reproducible:
      description: Build the release artefact twice and compare SHA-256.
      run: dart run tool/verify_reproducible.dart
      stdio: inherit

    devcontainer:create:
      description: Create the dev container.
      run: devcontainer up --workspace-folder . --config ./.devcontainer/devcontainer.json
      stdio: inherit

    devcontainer:start:
      description: Start the dev container and open a shell in it.
      run: >-
        "${CONTAINER:-podman}" start "$(basename "$MELOS_ROOT_PATH")" &&
        "${CONTAINER:-podman}" exec -it "$(basename "$MELOS_ROOT_PATH")" bash
      stdio: inherit

    verify:
      description: Everything CI runs on a push.
      dependsOn:
        - generate
        - l10n:parity
        - architecture
        - graph:check
        - format:check
        - analyze
        - share:boundary
        - test
        - coverage
        - viewer:build
        - viewer:build:deployed

