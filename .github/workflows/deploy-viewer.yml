name: Deploy viewer to Pages

# Deploys from the default branch, where releases land. Sitting there is also
# what makes workflow_dispatch usable — it only appears once the workflow file
# exists on the default branch — so forcing a redeployment no longer requires a
# commit. That in turn makes the paths filter affordable: an unrelated commit no
# longer needs to be able to trigger a run.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-viewer.yml
      - packages/furtive_share/**
      - site/**
      # Both halves of the build: the packager, and the script that compiles
      # and invokes it. Listing one and not the other would leave a change to
      # the other silently undeployed.
      - tool/build_viewer.dart
      - tool/package_viewer.py
      - apps/viewer/**
      # One workspace, one resolution: the viewer's dependencies are decided
      # here, so a change to either can change what is shipped.
      - pubspec.yaml
      - pubspec.lock

# contents stays read-only: the job reads the tree and publishes build/viewer.
# The two Pages scopes are what actions/deploy-pages needs to mint its OIDC
# token and attach the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One site, one deployment at a time. Not cancel-in-progress: interrupting a
# deployment mid-flight can leave the site serving a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Pinned to 24.04 for consistency with ci.yml and build-android.yml.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Read Flutter version from .fvmrc
        id: fvmrc
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.version }}
          channel: stable
          cache: true

      - name: Bootstrap the workspace
        run: |
          dart pub get --enforce-lockfile
          dart run melos bootstrap

      # Pages is static and cannot proxy tiles, so this deployment cannot honour
      # the same-origin basemap the self-hosted contract assumes. It loads the
      # OpenStreetMap standard basemap instead, which means every visitor
      # discloses the area they look at to the OSM Foundation. Stated plainly in
      # docs/SHARE-TRACKING.md; the packager grants exactly this origin in the
      # CSP and nothing wider.
      #
      # Keyless is the requirement, not a preference: a key in a public JS
      # bundle is extracted in minutes, and when it lapses every link already
      # handed out loses its map. CARTO was dropped for exactly that — its
      # basemaps now require an API key, quota and all, however long the CDN
      # keeps answering anonymous requests.
      #
      # The OSM tile policy requires a Referer from a website, and enforces it
      # by serving an "access denied" PNG under HTTP 200. index.html therefore
      # carries `referrer: strict-origin`, and tool/package_viewer.py fails the
      # build if that pairing is ever broken.
      - name: Compile and package the viewer
        env:
          VIEWER_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        run: dart run tool/build_viewer.dart build/site/share

      # The viewer is published under /share/ so the domain root can carry the
      # presentation page instead. That page holds no script at all: a share key
      # lives in the fragment of a /share/ URL, and only the audited viewer
      # bundle should ever be able to read one. site/CNAME keeps the custom
      # domain attached even if the repository setting is ever cleared.
      - name: Add the site root
        run: cp site/index.html site/CNAME build/site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
