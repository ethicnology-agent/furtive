name: CI

on:
  # Run on every push to every branch, not just main — otherwise work on a
  # long-lived feature/release branch (like this one) only gets checked once
  # a PR is opened, instead of on each push while it's still being iterated
  # on. `pull_request` is kept for the (rare) case of a PR from a fork,
  # where `push` wouldn't have repo permissions to report a status anyway.
  push:
  pull_request:

jobs:
  check:
    # Pinned to 24.04 for consistency with build-android.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Read Flutter version from .fvmrc
        id: fvmrc
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.version }}
          channel: stable
          cache: true

      - name: Bootstrap the workspace
        run: |
          dart pub get --enforce-lockfile
          dart run melos bootstrap

      # One script, defined in the root pubspec, so that what CI runs and what
      # `fvm exec dart run melos run verify` runs locally cannot drift apart.
      # It covers generation, ARB parity across every locale, module
      # boundaries, the dependency graph, formatting, analysis with
      # --fatal-infos, the share-layer boundary, every member's tests with
      # coverage, the coverage floor, and both viewer packagings.
      - name: Verify
        run: dart run melos run verify

      # Analyze/test cannot compile Kotlin, merge the Android manifest, resolve
      # MapLibre Native, or exercise release-only Gradle configuration.
      - name: Compile release APK
        working-directory: apps/app
        run: flutter build apk --release
